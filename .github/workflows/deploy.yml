name: Auto Deploy

# This workflow automatically builds and validates on every push to main
# If Vercel is connected to this GitHub repo, it will auto-deploy on push
# This workflow ensures the build succeeds before Vercel deploys

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
        continue-on-error: true
      
      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: Build Success
        run: |
          echo "✅ Build completed successfully!"
          echo "🚀 If Vercel is connected to GitHub, deployment will happen automatically"
          echo "📝 Check your Vercel dashboard for deployment status"
